# Builds the Windows installer when a GitHub Release is published (tag v*) and attaches it to that release.
# Manual run (workflow_dispatch) builds the installer as a downloadable artifact only.
# Code signing (SignPath) is added once the project is approved.
name: build-windows
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pytest -q tests
      - run: python -m PyInstaller --noconfirm --clean framediet.spec
      - run: choco install innosetup --no-progress -y
      - run: iscc installer\FrameDiet.iss
      - uses: actions/upload-artifact@v4
        with:
          name: FrameDiet-windows
          path: dist/FrameDiet-Setup-*.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FrameDiet-Setup-*.exe
          tag_name: ${{ github.ref_name }}
