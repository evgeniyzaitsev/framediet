# Builds the Windows installer on every version tag (v*) and on manual run.
# A tag also publishes a GitHub Release with the installer attached (pre-release for -beta/-rc tags).
# Code signing (SignPath) is added once the project is approved.
name: build-windows
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pytest -q tests
      - run: python -m PyInstaller --noconfirm --clean framediet.spec
      - run: choco install innosetup --no-progress -y
      - run: iscc installer\FrameDiet.iss
      - uses: actions/upload-artifact@v4
        with:
          name: FrameDiet-windows
          path: dist/FrameDiet-Setup-*.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FrameDiet-Setup-*.exe
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
          body: |
            Windows installer for FrameDiet ${{ github.ref_name }}.
            See CHANGELOG.md for what's new. The build is not code-signed yet: Windows SmartScreen may show
            "Unknown publisher" — click "More info" → "Run anyway".
